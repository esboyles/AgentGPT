[project]
name = "linecast-desktop"
version = "0.1.0"
description = "A desktop window and Home Assistant feed for linecast's weather, sun, moon and sky."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["linecast>=2.10"]

[project.scripts]
linecast-desktop = "linecast_desktop.server:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linecast_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
